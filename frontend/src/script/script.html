<div class="px-4 py-6">
  <div v-if="status === 'loading'" class="max-w-5xl mx-auto text-center">
    <img src="images/loader.gif" class="inline mt-10" alt="Loading script">
  </div>

  <div v-else-if="script" class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-xl font-semibold text-content">Script</h1>
        <p class="text-xs text-content-tertiary font-mono">{{ script._id }}</p>
      </div>
      <div class="flex items-center">
        <button
          v-if="!isEditing"
          class="px-3 py-1.5 mr-2 text-sm bg-gray-700 text-white rounded hover:bg-gray-600"
          @click="startEditing">
          Edit
        </button>
        <div class="relative flex items-center">
          <async-button
            class="px-3 py-1.5 text-sm bg-primary hover:bg-primary-hover text-primary-text rounded-l-md"
            @click="executeScript">
            {{ selectedRunLabel }}
          </async-button>
          <button
            class="px-1.5 py-1.5 text-sm bg-primary hover:bg-primary-hover text-primary-text border-l border-black/10 rounded-r-md"
            @click.stop="showRunDropdown = !showRunDropdown">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
            </svg>
          </button>
          <div
            v-if="showRunDropdown"
            class="absolute right-0 top-full z-10 mt-1 w-40 rounded-md bg-surface py-1 shadow-lg ring-1 ring-black/5">
            <button class="block w-full px-4 py-2 text-left text-xs text-content-secondary hover:bg-muted" @click="selectRunMode('run')">
              Run
            </button>
            <button
              class="block w-full px-4 py-2 text-left text-xs"
              :class="canUseDryRun ? 'text-content-secondary hover:bg-muted' : 'cursor-not-allowed text-gray-400'"
              :disabled="!canUseDryRun"
              :title="canUseDryRun ? null : 'Dry run mode requires MongoDB transaction support'"
              @click="selectRunMode('dryRun')">
              Dry Run
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="relative border rounded bg-surface text-content text-sm overflow-hidden">
      <div class="flex border-b py-1 pl-1 text-xs font-medium bg-surface">
        <button
          class="px-4 py-1 rounded-l-md border-r border-edge-strong font-semibold"
          :class="activeTab === 'code' ? 'bg-gray-700 text-white shadow' : 'bg-muted text-gray-600'"
          @click="activeTab = 'code'">
          Code
        </button>
        <button
          class="px-4 py-1 rounded-r-md font-semibold"
          :class="activeTab === 'output' ? 'bg-gray-700 text-white shadow' : 'bg-muted text-gray-600'"
          @click="activeTab = 'output'">
          Output<span v-if="isDryRunResult" class="ml-1">[Dry Run]</span>
        </button>
      </div>

      <div v-show="activeTab === 'code'" class="max-h-[65vh] overflow-y-auto">
        <div v-if="isEditing" class="flex flex-col">
          <ace-editor
            v-model="editedScript"
            mode="javascript"
            :line-numbers="true"
            class="w-full h-[55vh] min-h-[300px]"
          />
          <div class="flex justify-end p-2 border-t border-edge">
            <button class="px-3 py-1.5 text-xs bg-gray-300 text-gray-800 rounded hover:bg-gray-400" @click="cancelEditing">
              Cancel
            </button>
          </div>
        </div>
        <pre v-else class="whitespace-pre-wrap !my-0 bg-muted"><code ref="code" class="language-javascript" v-text="script.script"></code></pre>
      </div>

      <div v-show="activeTab === 'output'" class="p-3 max-h-[65vh] overflow-y-auto border-t">
        <div v-if="script.executionResult?.error" class="rounded-md bg-red-50 p-4 mb-3 text-sm text-red-800">
          {{ script.executionResult.error }}
        </div>
        <dashboard-result
          v-if="script.executionResult?.output != null"
          :result="script.executionResult.output">
        </dashboard-result>
        <pre v-else-if="!script.executionResult?.error">No output</pre>

        <div v-if="script.executionResult?.logs" class="mt-3 pt-3 border-t border-edge">
          <div class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Console</div>
          <pre class="mt-1 bg-muted text-content p-3 rounded whitespace-pre-wrap overflow-x-auto max-h-[280px]">{{ script.executionResult.logs }}</pre>
        </div>
      </div>
    </div>
  </div>

  <div v-else class="max-w-5xl mx-auto text-content-secondary">
    No script with the given id could be found.
  </div>
</div>
